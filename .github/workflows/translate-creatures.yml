name: Translate Creatures

on:
  schedule:
    # 매일 04:30 UTC (크롤러 0/6/12/18시와 어긋나게 배치)
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folklore-content-updates
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run translation (ko/zh/ja incremental)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/translate-creatures.mjs

      - name: Persist validated translations
        env:
          PIPELINE_NAME: translate
        run: |
          node scripts/validate-automation-data.mjs
          bash scripts/commit-automation.sh public/i18n
