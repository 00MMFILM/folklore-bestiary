name: Crawl Wikipedia Folklore

on:
  schedule:
    # 6시간마다 실행 (UTC 0, 6, 12, 18시)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_new:
        description: '최대 신규 항목 수 (검증 기본 1)'
        default: '1'

permissions:
  contents: write

concurrency:
  group: folklore-content-updates
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Wikipedia crawler
        env:
          CRAWL_MAX_NEW: ${{ inputs.max_new || '5' }}
        run: node scripts/crawl-wikipedia-folklore.mjs

      - name: Translate new creatures and rebuild tale links
        if: always() && !cancelled()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -f scripts/.last-added.json ]; then
            node scripts/translate-creatures.mjs
            node scripts/build-tale-links.mjs
          fi

      - name: Persist crawl progress and validated content
        if: always() && !cancelled()
        env:
          PIPELINE_NAME: crawl
        run: |
          node scripts/validate-automation-data.mjs
          bash scripts/commit-automation.sh lib/folklore-data.ts lib/site-stats.ts components/FolkloreMap.jsx scripts/crawl-state.json scripts/automation public/i18n content/tale-links.json

      - name: Notify search engines (IndexNow)
        run: |
          if [ -f scripts/.last-added.json ]; then
            sleep 180
            node scripts/submit-indexnow.mjs --from scripts/.last-added.json
          fi
