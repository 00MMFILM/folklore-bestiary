name: Test Content Automation
on:
  pull_request:
    paths: ['scripts/**', '.github/workflows/**', 'vercel.json']
  push:
    branches: [main]
    paths: ['scripts/**', '!scripts/automation/**', '!scripts/crawl-state.json', '!scripts/image-gen-progress.json', '.github/workflows/**', 'vercel.json']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-automation.mjs
      - run: node scripts/validate-automation-data.mjs
