name: Generate Creature Images

on:
  schedule:
    # 매일 05:00 UTC — 최대 10장. 모델/품질은 저장소 변수로 지정.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: '이번 실행에서 생성할 이미지 수'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: folklore-content-updates
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (sharp)
        run: npm ci

      - name: Select creatures without images
        env:
          IMAGE_BATCH: ${{ github.event.inputs.batch || '10' }}
        run: node scripts/select-images-to-generate.mjs

      - name: Generate images (OpenAI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'gpt-image-2' }}
          IMAGE_QUALITY: medium
        run: node scripts/generate-images.mjs

      - name: Persist generated images and failure report
        if: always() && !cancelled()
        env:
          PIPELINE_NAME: images
        run: |
          node scripts/apply-image-map.mjs
          node scripts/validate-automation-data.mjs
          bash scripts/commit-automation.sh public/creatures scripts/image-gen-progress.json lib/folklore-data.ts scripts/automation
