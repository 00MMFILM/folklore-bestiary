name: Generate Creature Articles

on:
  schedule:
    # 매일 05:30 UTC — 후보 최대 30개, API 호출 최대 150회, 응답당 3500 토큰 제한
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: '이번 실행에서 생성할 아티클 수'
        required: false
        default: '30'
      max_generated:
        description: '최대 완성 수 (검증 기본 1)'
        default: '1'
      country:
        description: '특정 국가 코드만 (예: KR, 비우면 전체)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: folklore-content-updates
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARTICLE_BATCH: ${{ inputs.batch || '30' }}
          ARTICLE_MAX_GENERATED: ${{ inputs.max_generated || '30' }}
          ARTICLE_COUNTRY: ${{ inputs.country }}
        run: |
          args=(--batch "$ARTICLE_BATCH" --max-generated "$ARTICLE_MAX_GENERATED" --concurrency 4)
          if [ -n "$ARTICLE_COUNTRY" ]; then args+=(--country "$ARTICLE_COUNTRY"); fi
          node scripts/generate-articles.mjs "${args[@]}"

      - name: Persist articles and retry history
        if: always() && !cancelled()
        env:
          PIPELINE_NAME: articles
        run: bash scripts/commit-automation.sh content/articles scripts/automation
